@if (descricao()) {
    <p class="search-result">
        {{ produtos().length }} resultado(s) para "<strong>{{ descricao() }}</strong>"
        <a routerLink="/produtos">Limpar busca</a>
    </p>
}

<section class="product-list">
    @for (produto of produtos(); track produto.id) {
        <div class="product-list__card">
            <a [routerLink]="['/produtos', produto.id]" class="product-list__link">
                <img [src]="produto.imagem" [alt]="produto.descricao" loading="lazy">
                <h2 class="product-item__name">
                    {{ produto.descricao }}
                </h2>
                <p class="product-item__price">
                    {{ produto.preco | currency }}
                </p>
                <p class="product-item__price-description">
                    {{ produto.descricaoPreco }}
                </p>
                <span class="product-item__buy-button">Comprar</span>
            </a>
        </div>
    } @empty {
        <p class="empty">Nenhum produto encontrado.</p>
    }
</section>
